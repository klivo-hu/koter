# Local / fresh-machine run.
#
# Identical image to production; the only differences are that the port is
# published on the host and the container joins a compose-managed network
# instead of the hosting platform's external one.
#
#   cp .env.example .env     # then fill JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD_HASH
#   docker compose -f docker-compose.local.yml up --build
#   open http://localhost:8080
services:
  web:
    build: .
    container_name: koter-gym-local
    restart: unless-stopped
    env_file:
      - .env
    # `environment` wins over `env_file`, so a production .env cannot move the
    # listener off the published port or point canonical URLs at the live domain.
    # SITE_URL is the variable the app reads first (lib/seo/site-url.ts).
    environment:
      PORT: '3000'
      SITE_URL: http://localhost:8080
    ports:
      - '8080:3000'
    volumes:
      - koter-gym-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  koter-gym-data:
