# Deploys to the Klivo Docker hosting platform (Traefik file-provider routing).
#
# The service, container and network names embed the platform client slug,
# "koter" (the panel client lives at clients/koter). The platform only lets a
# site join its own client's network, client_<slug>_net, so these three names
# must follow the slug if it ever changes. (CEF generated them from the
# project name, koter-gym, which is not the slug the panel uses.)
#
# The named volume is not optional: the SQLite database and every uploaded
# image live under /app/data, so without it a redeploy would discard the gym's
# prices, trainers and gallery.
#
# For a local run on a machine with no platform network, use:
#   docker compose -f docker-compose.local.yml up --build
services:
  hosting_koter_web:
    build: .
    container_name: hosting_koter_web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '80'
    volumes:
      - koter-gym-data:/app/data
    networks:
      - client_koter_net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  koter-gym-data:

networks:
  client_koter_net:
    external: true
