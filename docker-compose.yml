# Deploys to the Klivo Docker hosting platform (Traefik file-provider routing).
#
# The container name and network embed the client slug "koter-gym"; if the
# platform client uses a different slug, regenerate with
# `cef generate --client-slug <slug>` or edit the three names below to match.
#
# The named volume is not optional: the SQLite database and every uploaded
# image live under /app/data, so without it a redeploy would discard the gym's
# prices, trainers and gallery.
#
# For a local run on a machine with no platform network, use:
#   docker compose -f docker-compose.local.yml up --build
services:
  hosting_koter-gym_web:
    build: .
    container_name: hosting_koter-gym_web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '80'
    volumes:
      - koter-gym-data:/app/data
    networks:
      - client_koter-gym_net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  koter-gym-data:

networks:
  client_koter-gym_net:
    external: true
