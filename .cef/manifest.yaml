  cms: none
  budget: premium
  timeline: normal
  description: >-
    Kóter Gym & Crossfight Aréna edzőterem, küzdősport venue és sportegyesület
    Hatvanban, 2015 óta. Tagsági és bérletalapú membership venue: erőterem,
    crossfight és boksz terem, csoportos foglalkozások, tánctermi órák, személyi
    edzés. A weboldal bemutatja a termet, az árakat, a személyi edzőket, egy
    editorial fotógalériát, a csapatot, a versenyeredményeket, a helyszínt és a
    közösségi oldalakat.
  notes: >-
    Az ügyféllel egyeztetett publikus információs architektúra pontosan öt oldal:
    Főoldal, Árak, Edzők, Galéria, Rólunk. A kapcsolati adatok és a Google térkép
    a Rólunk oldalon élnek. Az admin felület JWT-vel védett, publikusan nem
    linkelt, és az árakat, az edzőket, a galériát, a díjakat, a jogi tartalmakat
    és a site beállításokat kezeli. A venue tagsági és napijegyes belépőket árul
    a helyszínen, online fizetés nélkül.
  businessGoals:
    - Bemutatni a termet és a közösséget prémium, hiteles módon
    - Egyértelművé tenni a bérlet- és jegyárakat
    - Bemutatni a személyi edzőket és elérhetőségüket
    - Erős vizuális márkajelenlét építése a galérián keresztül
